{% load static %}
<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmarVIP {% block title %}{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0a0a0a;
            color: #f0f0f0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* HEADER — always LTR, never flips */
        header {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            border-bottom: 1px solid #c9a84c;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr !important;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            direction: ltr;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .logo-text span:first-child { color: #f0f0f0; }
        .logo-text span:last-child { color: #c9a84c; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            direction: ltr;
        }

        /* LANGUAGE DROPDOWN */
        .lang-dropdown {
            position: relative;
        }

        .lang-dropdown-btn {
            background: #1a1a1a;
            border: 1px solid #c9a84c;
            color: #c9a84c;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .lang-dropdown-btn:hover { background: #2a2a2a; }

        .lang-dropdown-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            overflow: hidden;
            min-width: 130px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            z-index: 999;
        }

        .lang-dropdown-menu.open { display: block; }

        .lang-option {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
            direction: ltr;
        }

        .lang-option:hover { background: #2a2a2a; color: #fff; }
        .lang-option.active { color: #c9a84c; }

        /* WHATSAPP BUTTON */
        .whatsapp-btn {
            background: #25D366;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .whatsapp-btn:hover { background: #1ebe5d; }

        /* MAIN — direction controlled by JS */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #c9a84c;
        }

        .card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }

        .card-placeholder {
            width: 100%;
            aspect-ratio: 1;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .card-body { padding: 12px; }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #f0f0f0;
            margin-bottom: 4px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #c9a84c;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2a2a;
        }

        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .product-images img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .product-info { padding: 20px 0; }

        .product-name {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .big-order-btn {
            display: block;
            background: #25D366;
            color: white;
            padding: 16px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            margin-top: 25px;
            transition: background 0.2s;
        }

        .big-order-btn:hover { background: #1ebe5d; }

        .back-link {
            display: inline-block;
            color: #c9a84c;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .back-link:hover { text-decoration: underline; }

        footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 12px;
            border-top: 1px solid #1a1a1a;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            .product-detail { grid-template-columns: 1fr; }
            .logo-text { font-size: 22px; }
            header { padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">
            <svg width="45" height="45" viewBox="0 0 45 45" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="22.5" cy="22.5" r="22.5" fill="#c9a84c"/>
                <text x="22.5" y="29" text-anchor="middle" fill="#0a0a0a" font-size="18" font-weight="800" font-family="Arial">O</text>
            </svg>
            <div class="logo-text">
                <span>Omar</span><span>VIP</span>
            </div>
        </a>

        <div class="header-right">
            <!-- Language Dropdown -->
            <div class="lang-dropdown" id="langDropdown">
                <button class="lang-dropdown-btn" onclick="toggleDropdown()">
                    <span id="currentLangLabel">🌐 EN</span>
                    <span>▾</span>
                </button>
                <div class="lang-dropdown-menu" id="langMenu">
                    <div class="lang-option" onclick="setLang('en')">🇬🇧 English</div>
                    <div class="lang-option" onclick="setLang('he')">🇮🇱 עברית</div>
                    <div class="lang-option" onclick="setLang('ar')">🇸🇦 العربية</div>
                </div>
            </div>

            <a href="https://wa.me/972502544777" target="_blank" class="whatsapp-btn">
                💬 <span id="waLabel">WhatsApp</span>
            </a>
        </div>
    </header>

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer>
        OmarVIP &copy; 2025 &mdash; <span id="footer-rights">All rights reserved</span>
    </footer>

    <script>
        const translations = {
            en: {
                label: "🌐 EN",
                dir: "ltr",
                lang: "en",
                categories: "Categories",
                back: "← Back",
                order_now: "💬 Order Now",
                order_hint: "Sends directly to my WhatsApp",
                coming_soon: "Products coming soon...",
                no_products: "No products in this category yet",
                wa: "WhatsApp",
                rights: "All rights reserved"
            },
            he: {
                label: "🌐 עב",
                dir: "rtl",
                lang: "he",
                categories: "קטגוריות",
                back: "חזרה →",
                order_now: "💬 הזמן עכשיו",
                order_hint: "ישלח ל-WhatsApp שלי ישירות",
                coming_soon: "המוצרים יתווספו בקרוב...",
                no_products: "אין מוצרים בקטגוריה זו עדיין",
                wa: "וואטסאפ",
                rights: "כל הזכויות שמורות"
            },
            ar: {
                label: "🌐 ع",
                dir: "rtl",
                lang: "ar",
                categories: "الفئات",
                back: "رجوع →",
                order_now: "💬 اطلب الآن",
                order_hint: "سيتم الإرسال مباشرة على واتساب",
                coming_soon: "المنتجات قادمة قريباً...",
                no_products: "لا توجد منتجات في هذه الفئة بعد",
                wa: "واتساب",
                rights: "جميع الحقوق محفوظة"
            }
        };

        function toggleDropdown() {
            document.getElementById('langMenu').classList.toggle('open');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            if (!document.getElementById('langDropdown').contains(e.target)) {
                document.getElementById('langMenu').classList.remove('open');
            }
        });

        function setLang(lang) {
            localStorage.setItem('lang', lang);
            applyLang(lang);
            document.getElementById('langMenu').classList.remove('open');
        }

        function applyLang(lang) {
            const t = translations[lang];

            // Update HTML lang attribute only (no dir on html — header stays fixed)
            document.getElementById('html-root').setAttribute('lang', t.lang);

            // Only main content changes direction, NOT the header
            document.getElementById('main-content').setAttribute('dir', t.dir);
            document.querySelector('footer').setAttribute('dir', t.dir);

            // Update dropdown label
            document.getElementById('currentLangLabel').textContent = t.label;

            // Update static labels
            document.getElementById('waLabel').textContent = t.wa;
            document.getElementById('footer-rights').textContent = t.rights;

            // Update active option
            document.querySelectorAll('.lang-option').forEach(el => el.classList.remove('active'));
            const opts = document.querySelectorAll('.lang-option');
            const map = { en: 0, he: 1, ar: 2 };
            if (opts[map[lang]]) opts[map[lang]].classList.add('active');

            // Update all data-key elements
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (t[key]) el.textContent = t[key];
            });
        }

        // Apply on load
        const savedLang = localStorage.getItem('lang') || 'en';
        applyLang(savedLang);
    </script>
</body>
</html>
